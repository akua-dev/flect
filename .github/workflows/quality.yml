name: Flect quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      failure_probe:
        description: Prove that the public quality check fails closed
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Flect quality gate
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CI: true
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install the pinned Bun runtime
        uses: oven-sh/setup-bun@b7a1c7ccf290d58743029c4f6903da283811b979
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.93.0"
          components: rustfmt

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install the pinned Chromium runtime
        run: bunx playwright install chromium

      - name: Run the canonical quality gate
        run: bun run check:all

      - name: Deliberate failure probe
        if: github.event_name == 'workflow_dispatch' && inputs.failure_probe
        run: bun -e 'throw new Error("Deliberate Flect CI failure probe.")'

      - name: Upload bounded browser failure evidence
        if: failure() && !cancelled()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: flect-browser-failure-${{ github.run_id }}
          path: |
            test-results/**
            !test-results/control-state/**
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9
          include-hidden-files: false

[package]
name = "flect"
version = "0.2.0"
description = "The interface that takes your shape."
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0 OR MIT"

[lib]
name = "flect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = ["codegen", "isolation"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = ["isolation"] }
tauri-plugin-shell = "=2.3.5"
